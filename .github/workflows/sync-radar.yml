name: KRYPTO RADAR - synchronizacja danych

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pobierz aktualny raport z Hostido
        run: |
          curl --fail --silent --show-error \
            --location --retry 3 --max-time 60 \
            "https://host563984.xce.pl/krypto-radar/api/report" \
            -o report.json

      - name: Sprawdz poprawność raportu
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("report.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise ValueError("Raport nie jest obiektem JSON")
          if data.get("status") in ("BLAD", "OCZEKIWANIE"):
              raise ValueError("Radar nie udostępnia gotowego raportu")
          print("Raport JSON poprawny")
          PY

      - name: Zapisz raport w GitHub
        run: |
          git config user.name "krypto-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja raportu BCH/PLN"
            git push
          else
            echo "Brak zmian w raporcie"
          fi
